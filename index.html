<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>引き落とし、足りる？｜スマホ確認版</title><meta name="theme-color" content="#183249"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="引落チェック"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#193047;background:#f5f8fa;font-size:18px}*{box-sizing:border-box}body{margin:0}header{background:#183249;color:white;padding:22px max(16px,calc((100% - 960px)/2))}h1{margin:0;font-size:clamp(2.1rem,5vw,2.8rem);line-height:1.3}header p{margin:8px 0 0}main{max-width:960px;margin:auto;padding:18px}nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:18px}button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:12px 16px;background:#e8eef2;color:#193047}button.primary,.active{background:#087e88;color:white}button.danger{color:#a52531;background:#fff0f0}button.small{font-size:.85rem;padding:8px 10px}nav button{padding:13px 3px;font-size:.9rem}section{background:white;border:1px solid #e1e8ed;border-radius:14px;padding:20px;margin-bottom:16px}h2{margin:0 0 16px;font-size:1.25rem}h3{margin:14px 0 8px}p{line-height:1.6}.muted{color:#60727f;font-size:.9rem}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-weight:600}input,select{width:100%;padding:12px;border:1px solid #aebfc9;border-radius:8px;font:inherit;background:white;color:#193047}input[type=checkbox]{width:auto}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.item{padding:16px 0;border-top:1px solid #e5edf1}.item:first-child{border-top:0}.item-title{font-weight:700;font-size:1.1rem}.summary{border-left:6px solid #087e88;background:#f0fafb;padding:16px;border-radius:10px;margin-bottom:14px}.warning{border-left-color:#bd4535;background:#fff3ef}.big{font-size:clamp(2.1rem,6vw,3.3rem);font-weight:800;line-height:1.35}.critical{background:#fff0ed;border:2px solid #ad3429;border-radius:10px;padding:14px;margin:12px 0}.critical strong{color:#922a20}.hidden{display:none!important}.notice{background:#fff9e9;border:1px solid #eddb9e;border-radius:10px;padding:12px;margin:12px 0} .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap} @media(max-width:600px){:root{font-size:17px}main{padding:10px}section{padding:15px}nav{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}nav button{font-size:.94rem;padding:13px 4px;min-height:48px}.form{grid-template-columns:1fr}}
/* 説明文のみをスマートフォン向けに調整 */
.help-list{padding-left:1.35em;margin:10px 0 4px}.help-list li{line-height:1.65;margin:0 0 12px;padding-left:2px}.help-list li:last-child{margin-bottom:0}.help-list strong{font-weight:700}
@media(max-width:600px){.help-list{padding-left:1.25em}.help-list li{margin-bottom:14px;line-height:1.75}}
</style></head><body><header><h1>引き落とし、足りる？</h1><p>銀行ごとの引き落とし予定と不足額を分かりやすく確認</p></header><main><nav id="nav"></nav><div id="screen"></div></main><script>
'use strict';
const KEY='hikotoshi-clean-v2';
const PROBE='hikotoshi-persistence-probe-v2';
let storageStatus='未確認';
function probeStorage(){try{const prev=localStorage.getItem(PROBE);const current=String(Date.now());localStorage.setItem(PROBE,current);if(localStorage.getItem(PROBE)!==current)throw Error('readback');storageStatus=prev?'保存領域に前回の記録あり':'保存領域は利用可能（再起動後は未確認）'}catch{storageStatus='保存領域を利用できません'}}
probeStorage();
const blank=()=>({version:1,banks:[],fixed:[],oneoffs:[],deposits:[]});
let state=load(), tab='check', month=new Date().toISOString().slice(0,7), editing=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return valid(x)?x:blank()}catch{return blank()}}
function valid(x){return !!x&&x.version===1&&['banks','fixed','oneoffs','deposits'].every(k=>Array.isArray(x[k]))&&x.banks.length<1000&&x.fixed.length<3000&&x.oneoffs.length<10000&&x.deposits.length<10000}
function save(){try{const serialized=JSON.stringify(state);localStorage.setItem(KEY,serialized);if(localStorage.getItem(KEY)!==serialized)throw Error('保存後の照合に失敗');return true}catch{alert('保存を確認できませんでした。「確認」画面からバックアップを保存してください。');return false}}
const id=()=>String(Date.now())+Math.random().toString(36).slice(2,9);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>Number(n||0).toLocaleString('ja-JP')+'円';
const money=x=>x!==null&&x!==undefined&&String(x).trim()!==''&&Number.isSafeInteger(Number(x))&&Number(x)>=0&&Number(x)<=1e12?Number(x):null;
const monthLast=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const dateFor=(m,day)=>m+'-'+String(Math.min(Number(day),monthLast(m))).padStart(2,'0');
const bankName=id=>{const b=state.banks.find(x=>x.id===id);return b?b.name+'（登録'+(state.banks.indexOf(b)+1)+'）':'口座未設定'};
const opts=(selected='',empty=true)=> (empty?'<option value="">口座を選択</option>':'')+state.banks.map((b,i)=>`<option value="${esc(b.id)}" ${b.id===selected?'selected':''}>${esc(b.name)}（登録${i+1}・${yen(b.balance)}）</option>`).join('');
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function bankSelect(selected=''){return `<div class="field"><label for="bankId">引落口座</label><select id="bankId" name="bankId" required>${opts(selected)}</select></div>`}
function nav(){document.getElementById('nav').innerHTML=[['check','確認'],['banks','銀行'],['fixed','請求額'],['oneoffs','今月だけ'],['deposits','入金予定'],['help','使い方']].map(([t,n])=>`<button class="${tab===t?'active':''}" data-nav="${t}">${n}</button>`).join('')}
function render(){nav();let s=document.getElementById('screen');s.innerHTML=({check:showCheck,banks:showBanks,fixed:showFixed,oneoffs:showOneoffs,deposits:showDeposits,help:showHelp})[tab]();}
function showHelp(){return `<section><h2>使い方</h2><p>最初は、次の順番で操作してください。</p><h3>① 銀行を登録</h3><ul><li>「銀行」を押す</li><li>銀行名と、実際に確認した最新の残高を入力</li><li>残高を確認した日を入力して保存</li></ul><h3>② 引き落としを登録</h3><ul><li>「請求額」を押す</li><li>支払い先・引落日・銀行を登録</li><li>対象月を選び、その月の請求額を保存</li></ul><h3>③ 不足額を確認</h3><ul><li>「確認」を押し、対象月を選ぶ</li><li>「確認が必要です」と出たら、警告内容を確認</li><li>残高が変わったら「銀行」→「編集」で更新</li></ul><h3>必要なときだけ</h3><ul><li>臨時の支払い：「今月だけ」</li><li>入金の見込み：「入金予定」</li><li>「引落済」「入金済」は銀行で確認してから変更</li></ul><h3>過去の記録を見る</h3><ul class="help-list"><li>「確認」画面の「対象月」で見たい月を選びます。</li><li>その月に入力した請求額と引落済の記録を確認できます。</li><li>銀行の取引明細ではありません。</li></ul><h3>データはどう保存される？</h3><ul class="help-list"><li>入力して保存した内容は、通常、この端末のブラウザ内に残ります</li><li>毎回バックアップを読み込む必要はありません</li><li>端末変更やデータ消失に備えて「確認」→「バックアップを保存」を定期的に行ってください</li><li>データが消えた場合などに「バックアップから復元」を使います（現在のデータは置き換わります）</li><li>端末やブラウザの設定により保存が消える場合があります。バックアップは安全な場所に保管してください</li></ul><h3>銀行残高と個人情報</h3><ul class="help-list"><li>できるだけ当日確認した残高と、実際の確認日を入力してください</li><li>銀行口座や取引明細には接続しません</li><li>「要確認」の間は不足なしと判断しないでください</li><li>実際の残高・引き落とし結果は銀行で確認してください</li></ul><p class="notice">このアプリは銀行と自動連携しません。表示金額は入力情報に基づく目安です。</p></section>`}
function showBanks(){let b=editing?.kind==='banks'?state.banks.find(x=>x.id===editing.id):null;return `<section><h2>${b?'銀行を編集':'銀行口座を追加'}</h2><div class="notice"><strong>銀行口座の残高を入力する前に</strong><p>できるだけ当日確認した最新の銀行口座残高を入力し、実際に確認した日付を「残高を確認した日」に入力してください。古い残高を入力すると、正しい不足額を計算できない場合があります。</p><p>個人情報保護に配慮し、このアプリは銀行口座や取引明細とは連携していません。残高・引き落とし金額・入金予定はご自身で入力してください。</p></div><form id="bankForm" class="form">${field('銀行名（同名でも登録できます）','name','text',b?.name||'','required maxlength="60"')}${field('銀行口座の残高（円）','balance','number',b?.balance??'','required min="0" step="1"')}${field('残高を確認した日','asof','date',b?.asof||new Date().toISOString().slice(0,10),'required')}<div class="field full actions"><button class="primary">${b?'変更を保存':'口座を追加'}</button>${b?'<button type="button" data-cancel>キャンセル</button>':''}</div></form></section><section><h2>登録済みの銀行</h2><p class="muted">金額や日付を変更するときは、各銀行の「編集」を押してください。</p>${state.banks.length?state.banks.map((x,i)=>`<div class="item"><div class="item-title">${esc(x.name)}（登録${i+1}）</div><p>銀行口座の残高：${yen(x.balance)}<br>残高を確認した日：${esc(x.asof)}</p><div class="actions"><button data-edit="banks" data-id="${x.id}">編集</button><button class="danger" data-delete="banks" data-id="${x.id}">削除</button></div></div>`).join(''):'<p class="muted">まだ登録されていません。</p>'}</section>`}
function showFixed(){let b=editing?.kind==='fixed'?state.fixed.find(x=>x.id===editing.id):null;return `<section><h2>${b?'固定支払いを編集':'毎月の固定支払い先を登録'}</h2><p class="muted">カードごとに引落口座を指定します。請求額は月ごとに入力できます。</p><form id="fixedForm" class="form">${field('カード会社・支払い先','name','text',b?.name||'','required maxlength="80"')}${field('毎月の引落日（1〜31）','day','number',b?.day||'','required min="1" max="31"')}${bankSelect(b?.bankId)}<div class="field full actions"><button class="primary">${b?'変更を保存':'固定支払い先を登録'}</button>${b?'<button type="button" data-cancel>キャンセル</button>':''}</div></form></section><section><div class="row"><h2>${esc(month)} の固定支払い</h2>${monthInput()}</div>${state.fixed.length?state.fixed.map(x=>`<div class="item"><div class="item-title">${esc(x.name)}</div><p class="muted">毎月${x.day}日 ／ ${esc(bankName(x.bankId))}</p><div class="field"><label>この月の請求額（円・未入力は要確認）</label><input type="number" min="0" step="1" value="${esc(x.amounts?.[month]??'')}" data-amount="${x.id}" placeholder="未入力"></div><div class="actions"><button class="primary small" data-saveamount="${x.id}">金額を保存</button><button class="small" data-paidfixed="${x.id}">${x.paid?.[month]?'引落済（戻す）':'引落済にする'}</button><button class="small" data-edit="fixed" data-id="${x.id}">固定内容を編集</button><button class="danger small" data-delete="fixed" data-id="${x.id}">固定を削除</button></div></div>`).join(''):'<p>固定登録はありません。</p>'}</section>`}
function monthInput(){return `<label>対象月 <input aria-label="対象月" type="month" id="month" value="${month}" min="2020-01" max="2100-12"></label>`}
function currentLocalMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function previousLocalMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()).padStart(2,'0')}`.replace(/^(\d{4})-00$/,(_,y)=>`${Number(y)-1}-12`)}
function showOneoffs(){let b=editing?.kind==='oneoffs'?state.oneoffs.find(x=>x.id===editing.id):null;return `<section><h2>${b?'今月だけの支払いを編集':'今月だけの支払いを追加'}</h2><form id="oneForm" class="form">${field('支払い先','name','text',b?.name||'','required maxlength="80"')}${field('引落日','date','date',b?.date||month+'-20','required')}${field('請求額（円）','amount','number',b?.amount??'','required min="0" step="1"')}${bankSelect(b?.bankId)}<div class="field full actions"><button class="primary">${b?'変更を保存':'支払いを追加'}</button>${b?'<button type="button" data-cancel>キャンセル</button>':''}</div></form></section><section><div class="row"><h2>${esc(month)} の支払い</h2>${monthInput()}</div>${state.oneoffs.filter(x=>x.date.startsWith(month)).map(x=>`<div class="item"><div class="item-title">${esc(x.name)} — ${yen(x.amount)}</div><p class="muted">${esc(x.date)} ／ ${esc(bankName(x.bankId))}</p><div class="actions"><button data-paidone="${x.id}">${x.paid?'引落済（戻す）':'引落済にする'}</button><button data-edit="oneoffs" data-id="${x.id}">編集</button><button class="danger" data-delete="oneoffs" data-id="${x.id}">削除</button></div></div>`).join('')||'<p>今月だけの支払いはありません。</p>'}</section>`}
function showDeposits(){let b=editing?.kind==='deposits'?state.deposits.find(x=>x.id===editing.id):null;return `<section><h2>${b?'入金予定を編集':'入金予定を追加'}</h2><form id="depositForm" class="form">${field('入金名','name','text',b?.name||'','required maxlength="80"')}${field('入金日','date','date',b?.date||month+'-15','required')}${field('金額（円）','amount','number',b?.amount??'','required min="0" step="1"')}${bankSelect(b?.bankId)}<div class="field full actions"><button class="primary">${b?'変更を保存':'入金予定を追加'}</button>${b?'<button type="button" data-cancel>キャンセル</button>':''}</div></form></section><section><h2>入金予定一覧</h2>${state.deposits.map(x=>`<div class="item"><div class="item-title">${esc(x.name)} — ${yen(x.amount)}</div><p class="muted">${esc(x.date)} ／ ${esc(bankName(x.bankId))}</p><div class="actions"><button data-received="${x.id}">${x.received?'入金済（戻す）':'入金済にする'}</button><button data-edit="deposits" data-id="${x.id}">編集</button><button class="danger" data-delete="deposits" data-id="${x.id}">削除</button></div></div>`).join('')||'<p>入金予定はありません。</p>'}</section>`}
function calculate(b){
 let events=[],uncertain=[];
 const first=month+'-01',last=month+'-'+String(monthLast(month)).padStart(2,'0');
 // A snapshot from before the selected month does not account for intervening transactions.
 if(b.reviewDate)uncertain.push('引落済・入金済の記録を変更した後、銀行残高の再確認が終わっていません。銀行で最新残高を確認し、「銀行」の「編集」から残高と確認日を更新してください。確認する入出金の日付：'+b.reviewDate);
 if(b.asof<first)uncertain.push('銀行残高の確認日が対象月より前のため、不足額を確定できません。銀行残高の確認日が古い場合は、最新の残高を確認してください。「銀行」の「編集」から、残高と確認日を更新してください。');
 if(b.asof>last)uncertain.push('残高を確認した日が対象月より後です。対象月の不足額は確定できません');
 for(const f of state.fixed){
  if(f.bankId!==b.id)continue;
  const date=dateFor(month,f.day),v=f.amounts?.[month];
  if(f.paid?.[month]){if(date>b.asof)uncertain.push(f.name+'：残高を確認した日より後の引き落としが「引落済」になっています。実際の銀行残高と確認日を更新してください');continue}
  if(v===undefined||v===''){uncertain.push(f.name+'：請求額が未入力');continue}
  if(money(v)===null){uncertain.push(f.name+'：請求額が不正です');continue}
  if(date<=b.asof){uncertain.push(f.name+'：残高を確認した日以前の未完了記録');continue}
  events.push({date,amount:-Number(v),name:f.name})
 }
 for(const x of state.oneoffs){
  if(x.bankId!==b.id||!x.date.startsWith(month))continue;
  if(x.paid){if(x.date>b.asof)uncertain.push(x.name+'：残高を確認した日より後の引き落としが「引落済」になっています。実際の銀行残高と確認日を更新してください');continue}
  if(money(x.amount)===null){uncertain.push(x.name+'：金額が不正です');continue}
  if(x.date<=b.asof){uncertain.push(x.name+'：残高を確認した日以前の未完了記録');continue}
  events.push({date:x.date,amount:-Number(x.amount),name:x.name})
 }
 for(const x of state.deposits){
  if(x.bankId!==b.id||!x.date.startsWith(month))continue;
  if(x.received){if(x.date>b.asof)uncertain.push(x.name+'：残高を確認した日より後の入金が「入金済」になっています。実際の銀行残高と確認日を更新してください');continue}
  if(money(x.amount)===null){uncertain.push(x.name+'：金額が不正です');continue}
  if(x.date<=b.asof){uncertain.push(x.name+'：残高を確認した日以前の未入金予定');continue}
  events.push({date:x.date,amount:Number(x.amount),name:x.name})
 }
 events.sort((a,c)=>a.date.localeCompare(c.date)||a.amount-c.amount);
 let balance=Number(b.balance),max=0,when='',total=0;
 if(money(b.balance)===null){uncertain.push('銀行口座の残高が不正です');balance=0}
 for(const date of [...new Set(events.map(e=>e.date))]){
  const dayEvents=events.filter(e=>e.date===date);
  balance+=dayEvents.filter(e=>e.amount<0).reduce((sum,e)=>sum+e.amount,0);
  if(-balance>max){max=-balance;when=date}
  balance+=dayEvents.filter(e=>e.amount>0).reduce((sum,e)=>sum+e.amount,0);
  if(-balance>max){max=-balance;when=date}
 }
 total=events.filter(e=>e.amount<0).reduce((sum,e)=>sum-e.amount,0);
 return {max,when,total,uncertain,events,projectedBalance:balance}
}
function showPreviousMonth(){
 const fixed=state.fixed.filter(x=>x.amounts && x.amounts[month]!==undefined).map(x=>({name:x.name,amount:x.amounts[month],date:dateFor(month,x.day),bankId:x.bankId,paid:!!x.paid?.[month]}));
 const one=state.oneoffs.filter(x=>x.date.startsWith(month)).map(x=>({name:x.name,amount:x.amount,date:x.date,bankId:x.bankId,paid:!!x.paid}));
 const items=[...fixed,...one].sort((a,b)=>a.date.localeCompare(b.date));
 const total=items.reduce((sum,x)=>sum+Number(x.amount||0),0);
 return `<section><div class="row"><h2>過去の月の記録</h2>${monthInput()}</div><p class="muted">${esc(month)} に保存された請求額の記録です。現在の銀行残高を使って過去の不足額を計算することはしません。</p>${items.length?`<div class="summary"><div>登録されている請求額の合計</div><div class="big">${yen(total)}</div></div>${items.map(x=>`<div class="item"><div class="item-title">${esc(x.name)} — ${yen(x.amount)}</div><p class="muted">${esc(x.date)} ／ ${esc(bankName(x.bankId))} ／ ${x.paid?'引落済として記録':'引落済の記録なし'}</p></div>`).join('')}`:'<p>この月に保存された請求額はありません。</p>'}<div class="notice">この画面は保存された入力内容の確認用です。銀行の取引履歴ではなく、実際の引き落とし結果を保証するものではありません。未入力の請求額は合計に含まれません。</div></section>`;
}
function showCheck(){if(month<currentLocalMonth())return showPreviousMonth();let calc=state.banks.map(b=>({b,...calculate(b)})),sum=calc.reduce((n,x)=>n+x.max,0),hasUncertain=calc.some(x=>x.uncertain.length>0);return `<section><div class="row"><h2>引き落としの確認</h2>${monthInput()}</div><div class="summary ${sum||hasUncertain?'warning':''}"><div>${hasUncertain?'要確認：不足額は確定していません':'準備が必要な金額'}</div><div class="big">${!state.banks.length?'口座未登録':hasUncertain?'確認が必要です':yen(sum)}</div>${hasUncertain?'<div class="critical"><strong>この金額だけでは判断できません。</strong><p>銀行残高の確認日が古い場合は、最新の残高を確認してください。未入力の請求額や入出金の記録も確認してください。「要確認」がある間は不足なしと判断しないでください。</p></div>':''}<p class="muted">登録した引き落とし予定と銀行残高から計算しています。</p><p class="muted">${esc(month)} ／ 同日の入金は安全のため引落後に加算</p></div>${calc.map(x=>`<div class="item"><div class="item-title">${esc(bankName(x.b.id))}</div><p>銀行口座の残高 ${yen(x.b.balance)}（残高を確認した日：${esc(x.b.asof)}）</p><p><strong>${x.max?`最大不足 ${yen(x.max)}（${esc(x.when)} まで）`:x.uncertain.length?'不足額は未確定':'登録済み金額では不足なし'}</strong></p><p class="muted">未完了の支払い合計 ${yen(x.total)}</p><p><strong>${x.uncertain.length?'引き落とし後の予定残高：要確認':x.projectedBalance<0?`引き落とし後の不足：${yen(-x.projectedBalance)}不足`:`引き落とし後の予定残高：${yen(x.projectedBalance)}`}</strong></p><p class="muted">入力された残高と、この月の未完了の引き落とし・入金予定から計算した見込みです。銀行の実際の残高ではありません。</p>${x.uncertain.length?`<div class="notice"><strong>要確認：不足額は確定できません</strong><ul>${x.uncertain.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>残高の日付や記録に確認事項があるため、不足なしとは断定できません。</div>`:''}${x.events.length?`<details><summary>引き落とし金額を見る</summary>${x.events.map(e=>`<p>${esc(e.date)}：${esc(e.name)} ${e.amount<0?'引落':'入金'} ${yen(Math.abs(e.amount))}</p>`).join('')}</details>`:''}</div>`).join('')||'<p>まず「銀行」で口座を登録してください。</p>'}</section><section><h2>データの保存</h2><p>入力した内容は、各登録・変更時に自動保存されます。</p><div class="actions"><button class="primary" id="saveAll">保存する</button></div><p class="muted">現在登録されているデータを上書き保存します。未確定の入力欄がある場合は、先にその欄の「金額を保存」などを押してください。</p></section><section><h2>保存状態の確認</h2><p><strong>${esc(storageStatus)}</strong></p><div class="notice">HTMLファイルを直接開いている場合、ブラウザ内の保存は次回も残ると保証できません。入力後は必ず下の「バックアップを保存」でデータの控えを保存してください。データが消えた場合は「バックアップから復元」で戻せます。</div><p class="muted">保存領域の確認は、実際のデータが次回も残ることを保証するものではありません。</p></section><section><h2>データの保存・復元（バックアップ）</h2><ul class="help-list"><li><strong>通常の保存：</strong>入力したデータは、このブラウザ内に保存されます。</li><li><strong>バックアップを保存：</strong>データが消えた場合に備え、控えのファイルを作ります。</li><li><strong>バックアップから復元：</strong>控えのファイルを読み込み、現在のデータを置き換えます。</li><li><strong>過去の月を見る：</strong>「対象月」を変更すると、以前入力した請求額を確認できます。バックアップとは別です。</li><li><strong>大切な注意：</strong>別の端末やファイルにデータは自動で移りません。バックアップには入力した情報が含まれるため、安全な場所に保管してください。</li></ul><div class="actions"><button class="primary" id="export">バックアップを保存</button><button id="import">バックアップから復元</button><input type="file" id="importFile" accept=".json,application/json" hidden></div><div class="notice">保存されるデータはブラウザやファイルの開き方によって異なる場合があります。以前のファイルとバックアップは削除しないでください。</div></section><section><h2>ご利用上の注意</h2><ul class="help-list"><li>HTMLファイルを直接開く場合は、必ずバックアップを保存してください。</li><li>銀行口座とは自動連携しません。</li><li>銀行残高には、確認日までの入出金が反映された金額を入力してください。</li><li>「引落済」「入金済」を変更した場合は、銀行残高と確認日も更新してください。</li><li>実際の残高や引き落とし結果は、金融機関で確認してください。</li><li>現在は公開・販売前のテスト用です。実際の引き落としの成功を保証するものではありません。</li></ul></section>`}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function accept(form,kind){const x=formData(form),old=editing?.kind===kind?state[kind].find(t=>t.id===editing.id):null;if(kind==='banks'){let v=money(x.balance);if(v===null)return alert('残高を正しい金額で入力してください。');x.balance=v;if(!/^\d{4}-\d\d-\d\d$/.test(x.asof))return alert('基準日を確認してください。');if(old?.reviewDate){if(x.asof>=old.reviewDate){x.reviewDate=''}else{x.reviewDate=old.reviewDate;alert('入出金を変更した日より前の残高確認日です。「要確認」は継続します。')}}}if(kind==='fixed'){x.day=Number(x.day);if(!Number.isInteger(x.day)||x.day<1||x.day>31)return alert('引落日は1〜31で入力してください。');x.amounts=old?.amounts||{};x.paid=old?.paid||{}}if(kind==='oneoffs'||kind==='deposits'){let v=money(x.amount);if(v===null)return alert('金額を正しく入力してください。');x.amount=v;if(!/^\d{4}-\d\d-\d\d$/.test(x.date))return alert('日付を確認してください。');if(kind==='oneoffs')x.paid=old?.paid||false;else x.received=old?.received||false}if(kind!=='banks'&&!state.banks.some(b=>b.id===x.bankId))return alert('引落口座を選択してください。');x.name=x.name.trim();if(!x.name)return alert('名前を入力してください。');x.id=old?.id||id();if(old)Object.assign(old,x);else state[kind].push(x);if(save()){editing=null;render()}}
function requireBalanceReview(bankId,date){const b=state.banks.find(x=>x.id===bankId);if(b&&(!b.reviewDate||date>b.reviewDate))b.reviewDate=date}
function reconcileRevertedReview(bankId){
 const b=state.banks.find(x=>x.id===bankId);
 if(!b||!b.reviewDate)return;
 // A reverted test entry may be safely cleared only when there are no
 // completed transactions remaining for this account.
 const completedFixed=state.fixed.some(f=>f.bankId===bankId&&Object.values(f.paid||{}).some(Boolean));
 const completedOne=state.oneoffs.some(x=>x.bankId===bankId&&x.paid);
 const completedDeposits=state.deposits.some(x=>x.bankId===bankId&&x.received);
 if(!completedFixed&&!completedOne&&!completedDeposits)b.reviewDate='';
}
function remove(kind,id){let x=state[kind].find(t=>t.id===id);if(!x)return;if(kind==='banks'&&[...state.fixed,...state.oneoffs,...state.deposits].some(t=>t.bankId===id))return alert('この口座を使用している支払い・入金があります。先に引落口座を変更してください。');if(!confirm('「'+x.name+'」を削除しますか？'))return;state[kind]=state[kind].filter(t=>t.id!==id);save();editing=null;render()}
function importBackup(file){if(!file)return;if(file.size>3e6)return alert('ファイルが大きすぎます。');let reader=new FileReader();reader.onload=()=>{let data;try{data=JSON.parse(reader.result)}catch{return alert('JSONファイルを読み取れません。')}if(!valid(data))return alert('このバックアップの形式を確認できません。旧版のファイルはそのまま保存してください。');if(!data.banks.every(b=>typeof b.id==='string'&&typeof b.name==='string'&&money(b.balance)!==null&&/^\d{4}-\d\d-\d\d$/.test(b.asof))||!['fixed','oneoffs','deposits'].every(k=>data[k].every(x=>typeof x.id==='string'&&typeof x.name==='string'&&typeof x.bankId==='string'&&data.banks.some(b=>b.id===x.bankId))))return alert('バックアップの内容を確認できません。');if(!confirm('現在のデータをバックアップの内容に置き換えます。よろしいですか？'))return;const previous=state;state=data;if(!save()){state=previous;render();return}editing=null;render();alert('読み込みました。')};reader.readAsText(file)}
document.addEventListener('submit',e=>{let m={bankForm:'banks',fixedForm:'fixed',oneForm:'oneoffs',depositForm:'deposits'}[e.target.id];if(m){e.preventDefault();accept(e.target,m)}});
document.addEventListener('change',e=>{if(e.target.id==='month'&&/^\d{4}-\d\d$/.test(e.target.value)){month=e.target.value;editing=null;render()}if(e.target.id==='importFile')importBackup(e.target.files[0])});
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;let d=t.dataset;if(d.nav){tab=d.nav;editing=null;render();return}if('cancel'in d){editing=null;render();return}if(d.edit){editing={kind:d.edit,id:d.id};render();window.scrollTo(0,0);return}if(d.delete){remove(d.delete,d.id);return}if(d.saveamount){let el=document.querySelector(`[data-amount="${d.saveamount}"]`),f=state.fixed.find(x=>x.id===d.saveamount),v=el.value;if(v===''){delete f.amounts[month]}else{let n=money(v);if(n===null)return alert('正しい金額を入力してください。');f.amounts[month]=n}save();render();return}if(d.paidfixed){let f=state.fixed.find(x=>x.id===d.paidfixed);if(!f)return;if(!f.paid[month]&&!confirm('銀行で実際に引き落とされたことを確認しましたか？\n「引落済」にした後は、銀行口座の残高と「残高を確認した日」も更新してください。'))return;f.paid[month]=!f.paid[month];requireBalanceReview(f.bankId,dateFor(month,f.day));if(!f.paid[month])reconcileRevertedReview(f.bankId);save();render();return}if(d.paidone){let x=state.oneoffs.find(x=>x.id===d.paidone);if(!x)return;if(!x.paid&&!confirm('銀行で実際に引き落とされたことを確認しましたか？\n「引落済」にした後は、銀行口座の残高と「残高を確認した日」も更新してください。'))return;x.paid=!x.paid;requireBalanceReview(x.bankId,x.date);if(!x.paid)reconcileRevertedReview(x.bankId);save();render();return}if(d.received){let x=state.deposits.find(x=>x.id===d.received);if(!x)return;if(!x.received&&!confirm('銀行で実際に入金されたことを確認しましたか？\n「入金済」にした後は、銀行口座の残高と「残高を確認した日」も更新してください。'))return;x.received=!x.received;requireBalanceReview(x.bankId,x.date);if(!x.received)reconcileRevertedReview(x.bankId);save();render();return}if(t.id==='saveAll'){if(save())alert('保存しました。');return}if(t.id==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='引き落とし足りる_バックアップ_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(t.id==='import'){document.getElementById('importFile').click()}});
// Clear a stale review flag left by a reverted test transaction.
const reviewBefore=JSON.stringify(state.banks.map(b=>b.reviewDate||''));
state.banks.forEach(b=>reconcileRevertedReview(b.id));
if(reviewBefore!==JSON.stringify(state.banks.map(b=>b.reviewDate||'')))save();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script></body></html>
